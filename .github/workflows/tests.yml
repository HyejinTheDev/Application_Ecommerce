name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      VERSION: '3.2.2'
      SERVERPOD_PASSWORD_database: 'pZ-cElLWAFLNu1Xqml4l766Cb6EOms7A'
      SERVERPOD_PASSWORD_redis: 'xeiu-xaW_vBeK-phS6MnPLc5Z3S4OV7R'

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'

      - name: Start containers
        working-directory: my_ecommerce_server
        run: docker compose up --build -d

      - name: Install dependencies
        working-directory: my_ecommerce_server
        run: dart pub get

      - name: Install Serverpod CLI
        working-directory: my_ecommerce_server
        run: dart pub global activate serverpod_cli $VERSION

      - name: Run Serverpod generator
        working-directory: my_ecommerce_server
        run: serverpod generate

      - name: Run tests
        working-directory: my_ecommerce_server
        run: dart test

      - name: Stop containers
        if: always()
        working-directory: my_ecommerce_server
        run: docker compose down -v
