services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: my_ecommerce
      POSTGRES_PASSWORD: "HVBYevqnow3_Shdhn_ccmEFiw5fHjysB"
    volumes:
      - my_ecommerce_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "GtuU-8FD6RxzFjM6z9iUqteEphgi6mUp"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: my_ecommerce_test
      POSTGRES_PASSWORD: "pZ-cElLWAFLNu1Xqml4l766Cb6EOms7A"
    volumes:
      - my_ecommerce_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "xeiu-xaW_vBeK-phS6MnPLc5Z3S4OV7R"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  my_ecommerce_data:
  my_ecommerce_test_data:
